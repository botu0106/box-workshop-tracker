{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<div class="row justify-content-center">
  <div class="col-12 col-sm-8 col-md-5">
    <h1 class="h3 mb-3">Log in</h1>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" class="d-grid gap-3">
      <div>
        <label class="form-label">Username</label>
        <input name="username" class="form-control" required autocomplete="username" autofocus>
      </div>
      <div>
        <label class="form-label">Password</label>
        <div class="input-group">
          <input name="password" id="password" type="password" class="form-control"
                 required autocomplete="current-password">
          <button type="button" class="btn btn-outline-secondary" id="toggle-password"
                  aria-label="Show password">
            <i class="bi bi-eye" id="toggle-icon"></i>
          </button>
        </div>
      </div>
      <button class="btn btn-primary">Log in</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  // Show or hide the password when the eye button is pressed
  const passwordInput = document.getElementById("password");
  const toggleButton = document.getElementById("toggle-password");
  const toggleIcon = document.getElementById("toggle-icon");

  toggleButton.addEventListener("click", function () {
    const hidden = passwordInput.type === "password";
    passwordInput.type = hidden ? "text" : "password";
    toggleIcon.className = hidden ? "bi bi-eye-slash" : "bi bi-eye";
    toggleButton.setAttribute("aria-label", hidden ? "Hide password" : "Show password");
  });
</script>
{% endblock %}
